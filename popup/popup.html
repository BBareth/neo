<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neo AI</title>
  <link rel="stylesheet" href="../sidebar/sidebar.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <button id="convToggle" class="icon-btn" title="Conversations">☰</button>
    <button id="brand" class="brand" title="Conversations">
      <span class="brand-mark">✦</span>
      <span class="brand-name">Neo</span>
      <span class="caret">▾</span>
    </button>
    <div class="spacer"></div>
    <button id="newChatBtn" class="icon-btn" title="New chat">＋</button>
    <button id="addPageBtn" class="icon-btn" title="Add an open page">📄</button>
    <button id="screenshotBtn" class="icon-btn" title="Screenshot this page">📷</button>
    <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
  </header>

  <div id="convDrawer" class="conv-drawer">
    <div class="conv-drawer-head">
      <span class="conv-drawer-title">Conversations</span>
      <button id="newChatBtn2" class="text-btn">+ New chat</button>
    </div>
    <div id="convList" class="conv-list"></div>
  </div>

  <div id="tabPicker" class="tab-picker"></div>

  <main id="messages" class="messages"></main>

  <footer id="composer" class="composer">
    <div id="attachments" class="attachments"></div>
    <div class="composer-row">
      <textarea id="input" rows="1" placeholder="Message Neo…"></textarea>
      <button id="sendBtn" class="send-btn" title="Send">➤</button>
    </div>
    <div class="composer-hint">Enter to send · Shift+Enter for newline</div>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="../sidebar/sidebar.js"></script>
</body>
</html>
