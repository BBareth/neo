<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neo AI — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="card">
    <header class="head">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <h1>Neo AI</h1>
      </div>
      <p class="sub">Connect your own AI provider. Your key is stored locally in Firefox and never leaves your machine except when sent directly to the provider you configure.</p>
    </header>

    <section class="fields">
      <div class="field">
        <label for="provider">Provider</label>
        <select id="provider">
          <option value="openai">OpenAI-compatible (OpenAI, OpenRouter, Groq, Ollama, LM Studio…)</option>
          <option value="deepseek">DeepSeek</option>
          <option value="anthropic">Anthropic (Claude)</option>
        </select>
      </div>

      <div class="field">
        <label>Open mode</label>
        <div class="radio-group">
          <label class="radio"><input type="radio" name="openMode" value="sidebar" /> <span>Sidebar — stays open on the right</span></label>
          <label class="radio"><input type="radio" name="openMode" value="popup" /> <span>Popup — closes when you click away (like Bitwarden)</span></label>
        </div>
      </div>

      <div class="field">
        <label for="baseUrl">Base URL</label>
        <input type="text" id="baseUrl" spellcheck="false" placeholder="https://api.openai.com/v1" />
        <p class="hint">OpenAI-compatible and DeepSeek append <code>/chat/completions</code>. Anthropic appends <code>/v1/messages</code>.</p>
      </div>

      <div class="field">
        <label for="apiKey">API key</label>
        <div class="key-row">
          <input type="password" id="apiKey" spellcheck="false" autocomplete="off" placeholder="sk-…" />
          <label class="show-key"><input type="checkbox" id="showKey" /> Show</label>
        </div>
      </div>

      <div class="field">
        <label for="model">Model</label>
        <select id="model"></select>
        <input type="text" id="customModel" class="hidden" spellcheck="false" placeholder="Enter model name (e.g. gpt-4o, meta-llama/llama-3.1-70b…)" />
      </div>

      <div class="field">
        <label for="systemPrompt">System prompt</label>
        <textarea id="systemPrompt" rows="4" spellcheck="false"></textarea>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="temperature">Temperature</label>
          <input type="number" id="temperature" min="0" max="2" step="0.1" />
        </div>
        <div class="field">
          <label for="maxTokens">Max tokens</label>
          <input type="number" id="maxTokens" min="1" step="1" />
        </div>
      </div>
    </section>

    <footer class="actions">
      <button id="testBtn" class="secondary" type="button">Test connection</button>
      <button id="saveBtn" class="primary" type="button">Save</button>
      <span id="status" class="status"></span>
    </footer>
  </main>

  <script src="options.js"></script>
</body>
</html>
